[package]
name = "fg-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "FireGuard 接口层：Axum 路由、认证、WS、静态资源"

[dependencies]
fg-domain = { path = "../fg-domain" }
fg-contracts = { path = "../fg-contracts" }
fg-store = { path = "../fg-store" }
fg-app = { path = "../fg-app" }
fg-infer = { path = "../fg-infer" }
fg-media = { path = "../fg-media" }
axum = { version = "0.8", features = ["multipart", "ws"] }
anyhow = "1"
base64 = "0.22"
bcrypt = "0.17"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
