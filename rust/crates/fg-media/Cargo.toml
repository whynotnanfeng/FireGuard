[package]
name = "fg-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "FireGuard 媒体：标注绘制、HLS 播放列表、FFmpeg 采集/编码、MediaMTX 编排与 ONVIF"

[dependencies]
fg-domain = { path = "../fg-domain" }
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
parking_lot = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
