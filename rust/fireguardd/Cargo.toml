[package]
name = "fireguardd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "FireGuard 火灾智能监测系统核心服务"

[[bin]]
name = "fireguardd"
path = "src/main.rs"

[dependencies]
fg-contracts = { path = "../crates/fg-contracts" }
fg-domain = { path = "../crates/fg-domain" }
fg-infer = { path = "../crates/fg-infer" }
fg-media = { path = "../crates/fg-media" }
fg-store = { path = "../crates/fg-store" }
fg-app = { path = "../crates/fg-app" }
fg-server = { path = "../crates/fg-server" }
axum = "0.8"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "charset", "http2"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }
