<!DOCTYPE html>
<html>
<head>
    <title>FireGuard Stream Simulator PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #1677ff;
            --success: #52c41a;
            --warning: #faad14;
            --error: #ff4d4f;
            --processing: #1677ff;
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --border: #f0f0f0;
            --text: rgba(0,0,0,0.88);
            --text-secondary: rgba(0,0,0,0.45);
            --text-tertiary: rgba(0,0,0,0.25);
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: var(--text);
            font-size: 14px;
            line-height: 1.5714;
        }
        .page-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-radius: 12px;
            padding: 24px 32px;
            margin-bottom: 24px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
            overflow: hidden;
        }
        .card-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
        }
        .card-header h5 { margin: 0; font-size: 16px; font-weight: 600; }
        .card-body { padding: 24px; }
        .btn-primary { background: var(--primary); border-color: var(--primary); border-radius: 6px; padding: 8px 16px; }
        .btn-success { background: var(--success); border-color: var(--success); border-radius: 6px; }
        .form-control, .form-select { border-radius: 6px; border: 1px solid #d9d9d9; padding: 6px 12px; font-size: 14px; }
        .table thead th {
            background: #fafafa;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            padding: 12px 16px;
        }
        .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
        .meta-item { background: #fafafa; border-radius: 6px; padding: 8px 10px; text-align: center; }
        .meta-item .label { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; margin-bottom: 2px; }
        .meta-item .value { font-size: 14px; font-weight: 600; color: var(--text); }
        .grade-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .grade-badge.error { background: #fff2f0; color: var(--error); border: 1px solid #ffccc7; }
        .grade-badge.warning { background: #fffbe6; color: #d48806; border: 1px solid #ffe58f; }
        .grade-badge.success { background: #f6ffed; color: var(--success); border: 1px solid #b7eb8f; }
        .grade-badge.processing { background: #e6f4ff; color: var(--primary); border: 1px solid #91caff; }
        .rtsp-code { background: #f5f5f5; border: 1px solid #d9d9d9; border-radius: 6px; padding: 4px 8px; font-family: monospace; font-size: 12px; }
        
        /* 优化后的配置面板 */
        .config-panel {
            background: #fcfcfc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }
        .config-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .config-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .original-hint {
            color: var(--primary);
            font-weight: 500;
        }

        /* Loading Overlay */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
        }
        .spinner-grow { width: 3rem; height: 3rem; color: var(--primary); }
        .loading-text { margin-top: 16px; font-weight: 600; color: var(--text); }
    </style>
</head>
<body>
    <div id="loadingOverlay">
        <div class="spinner-grow" role="status"></div>
        <div class="loading-text" id="loadingText">处理中...</div>
    </div>

    <div class="container" style="max-width: 1300px;">
        <div class="page-header">
            <div><h2>FireGuard 流模拟控制台</h2></div>
            <div id="connectionStatus"><i class="bi bi-cpu-fill me-2"></i>系统在线</div>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="row align-items-center g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">设备名称</label>
                        <input type="text" class="form-control" id="deviceName" placeholder="例如：正门主摄">
                    </div>
                    <div class="col-md-5">
                        <label class="form-label fw-bold">视频源文件</label>
                        <input type="file" class="form-control" id="fileInput" accept="video/*">
                    </div>
                    <div class="col-md-3 mt-md-4">
                        <button class="btn btn-primary w-100" id="uploadBtn" onclick="upload()">
                            <i class="bi bi-cloud-upload me-2"></i>上传并解析
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header">
                <h5><i class="bi bi-collection-play me-2"></i>视频库 & 自定义推流</h5>
            </div>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th style="width:15%">源设备</th>
                            <th style="width:20%">画质规格</th>
                            <th style="width:55%">自定义推流参数 (默认原配置)</th>
                            <th class="text-end" style="width:10%">操作</th>
                        </tr>
                    </thead>
                    <tbody id="videoLibrary"></tbody>
                </table>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header">
                <h5><i class="bi bi-broadcast me-2"></i>活动流状态</h5>
                <span class="badge bg-primary" id="activeCount">0</span>
            </div>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th style="width:20%">源设备</th>
                            <th style="width:60%">RTSP 地址</th>
                            <th class="text-end" style="width:20%">操作</th>
                        </tr>
                    </thead>
                    <tbody id="activeStreams"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function showLoading(text = '处理中...') {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function formatBitrate(bps) {
            if (!bps) return '-';
            return (bps / 1000000).toFixed(1) + ' Mbps';
        }

        let lastVideoData = '';
        let lastStreamData = '';

        async function refresh() {
            try {
                const [vRes, sRes] = await Promise.all([fetch('/videos'), fetch('/streams')]);
                const videos = await vRes.json();
                const streams = await sRes.json();

                // 检查是否有输入框或下拉框处于激活状态
                const activeEl = document.activeElement;
                const isInteracting = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'SELECT');

                // 数据对比，避免无谓的刷新
                const videoDataStr = JSON.stringify(videos);
                const streamDataStr = JSON.stringify(streams);
                
                const videosChanged = videoDataStr !== lastVideoData;
                const streamsChanged = streamDataStr !== lastStreamData;

                document.getElementById('activeCount').innerText = streams.length;
                
                // 只有在数据变化且用户没在操作时才更新 DOM
                if (streamsChanged && (!isInteracting || !document.getElementById('activeStreams').contains(activeEl))) {
                    document.getElementById('activeStreams').innerHTML = streams.map(s => `
                        <tr>
                            <td>
                                <strong>${s.device_name || '未知'}</strong>
                                <div class="text-muted small">${s.video_path.split(/[\\/]/).pop()}</div>
                            </td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <code class="rtsp-code flex-grow-1">${s.rtsp_url}</code>
                                    <button class="btn btn-sm btn-link text-muted p-0 ms-2" title="复制地址" onclick="copyUrl('${s.rtsp_url}', this)">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </div>
                                <div class="small text-muted mt-2 d-flex flex-wrap gap-2">
                                    <span class="badge bg-light text-dark border"><i class="bi bi-film me-1"></i>${s.vcodec}</span>
                                    <span class="badge bg-light text-dark border"><i class="bi bi-volume-up me-1"></i>${s.acodec}</span>
                                    <span class="badge bg-light text-dark border"><i class="bi bi-aspect-ratio me-1"></i>${s.resolution}</span>
                                    <span class="badge bg-light text-dark border"><i class="bi bi-speedometer2 me-1"></i>${s.fps > 0 ? s.fps + 'fps' : 'Original'}</span>
                                    <span class="badge bg-light text-dark border"><i class="bi bi-lightning-charge me-1"></i>${s.bitrate}</span>
                                    <span class="badge bg-light text-dark border"><i class="bi bi-gear me-1"></i>${s.preset || '-'}</span>
                                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle"><i class="bi bi-hdd-network me-1"></i>${s.transport.toUpperCase()}</span>
                                </div>
                            </td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-danger" onclick="stopStream('${s.id}', this)">
                                    <i class="bi bi-stop-circle me-1"></i>停止
                                </button>
                            </td>
                        </tr>
                    `).join('') || '<tr><td colspan="3" class="text-center text-muted py-4">暂无活动推流</td></tr>';
                    lastStreamData = streamDataStr;
                }

                if (videosChanged && (!isInteracting || !document.getElementById('videoLibrary').contains(activeEl))) {
                    document.getElementById('videoLibrary').innerHTML = videos.filter(v => {
                        return !streams.some(s => s.video_path.includes(v.file_id));
                    }).map(v => {
                        return `
                            <tr>
                                <td>
                                    <strong>${v.device_name}</strong>
                                    <div class="text-muted small">${v.filename}</div>
                                    <div class="mt-2">
                                        <span class="grade-badge ${v.grade?.color || 'processing'}">${v.grade?.label || '未知'}</span>
                                    </div>
                                </td>
                                <td>
                                    <div class="meta-grid">
                                        <div class="meta-item"><div class="label">分辨率</div><div class="value">${v.width}x${v.height}</div></div>
                                        <div class="meta-item"><div class="label">编码</div><div class="value">${v.codec}</div></div>
                                        <div class="meta-item"><div class="label">帧率</div><div class="value">${v.fps || '-'}</div></div>
                                        <div class="meta-item"><div class="label">码率</div><div class="value">${formatBitrate(v.bit_rate)}</div></div>
                                    </div>
                                </td>
                                <td>
                                    <div class="config-panel">
                                        <div class="input-group input-group-sm mb-3">
                                            <span class="input-group-text bg-light text-muted">推流路径 /</span>
                                            <input type="text" class="form-control" id="path_${v.file_id}" value="cam_${v.file_id.slice(0,4)}">
                                            <span class="input-group-text bg-light text-muted">传输协议</span>
                                            <select class="form-select" id="transport_${v.file_id}" style="max-width:100px;">
                                                <option value="tcp">TCP</option>
                                                <option value="udp">UDP</option>
                                            </select>
                                        </div>
                                        <div class="config-grid">
                                            <div>
                                                <div class="config-label">视频编码 <span class="original-hint">原:${v.codec}</span></div>
                                                <select class="form-select form-select-sm" id="vcodec_${v.file_id}">
                                                    <option value="copy" selected>Original (Copy)</option>
                                                    <option value="libx264">H.264 (libx264)</option>
                                                    <option value="libx265">H.265 (libx265)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <div class="config-label">音频编码 <span class="original-hint">原:自动</span></div>
                                                <select class="form-select form-select-sm" id="acodec_${v.file_id}">
                                                    <option value="copy" selected>Original (Copy)</option>
                                                    <option value="aac">AAC</option>
                                                    <option value="none">无音频 (None)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <div class="config-label">分辨率 <span class="original-hint">原:${v.width}x${v.height}</span></div>
                                                <select class="form-select form-select-sm" id="res_${v.file_id}">
                                                    <option value="original" selected>Original</option>
                                                    <option value="3840x2160">3840x2160 (4K)</option>
                                                    <option value="2560x1440">2560x1440 (2K)</option>
                                                    <option value="1920x1080">1920x1080 (1080P)</option>
                                                    <option value="1280x720">1280x720 (720P)</option>
                                                    <option value="854x480">854x480 (480P)</option>
                                                    <option value="640x360">640x360 (360P)</option>
                                                    <option value="426x240">426x240 (240P)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <div class="config-label">帧率 (FPS) <span class="original-hint">原:${v.fps || '-'}</span></div>
                                                <select class="form-select form-select-sm" id="fps_${v.file_id}">
                                                    <option value="0" selected>Original</option>
                                                    <option value="60">60 FPS</option>
                                                    <option value="30">30 FPS</option>
                                                    <option value="25">25 FPS</option>
                                                    <option value="15">15 FPS</option>
                                                    <option value="10">10 FPS</option>
                                                    <option value="5">5 FPS</option>
                                                </select>
                                            </div>
                                            <div>
                                                <div class="config-label">视频码率 <span class="original-hint">原:${formatBitrate(v.bit_rate)}</span></div>
                                                <select class="form-select form-select-sm" id="bitrate_${v.file_id}">
                                                    <option value="original" selected>Original</option>
                                                    <option value="8000k">8 Mbps</option>
                                                    <option value="4000k">4 Mbps</option>
                                                    <option value="1000k">1 Mbps</option>
                                                    <option value="500k">500 Kbps</option>
                                                    <option value="200k">200 Kbps</option>
                                                    <option value="100k">100 Kbps</option>
                                                </select>
                                            </div>
                                            <div>
                                                <div class="config-label">编码预设 <span class="original-hint">速度 vs 质量</span></div>
                                                <select class="form-select form-select-sm" id="preset_${v.file_id}">
                                                    <option value="ultrafast">极速 (Ultrafast)</option>
                                                    <option value="faster">较快 (Faster)</option>
                                                    <option value="medium" selected>均衡 (Medium)</option>
                                                    <option value="slow">质量 (Slow)</option>
                                                </select>
                                            </div>
                                        </div>
                                        <input type="hidden" id="crf_${v.file_id}" value="23">
                                    </div>
                                </td>
                                <td class="text-end">
                                    <button class="btn btn-success btn-sm w-100 mb-2 py-2" onclick="startStream(this, '${v.file_id}')">
                                        <i class="bi bi-play-fill me-1"></i>启动模拟
                                    </button>
                                    <button class="btn btn-link btn-sm text-danger w-100" onclick="deleteVideo('${v.file_id}')">删除源文件</button>
                                </td>
                            </tr>
                        `;
                    }).join('') || '<tr><td colspan="4" class="text-center text-muted py-5">视频库为空，请先上传视频源</td></tr>';
                    lastVideoData = videoDataStr;
                }
            } catch(e) { console.error(e); }
        }

        async function upload() {
            const fileInput = document.getElementById('fileInput');
            const deviceInput = document.getElementById('deviceName');
            const file = fileInput.files[0];
            if(!file) return;

            showLoading('正在上传并解析视频元数据...');
            
            const fd = new FormData();
            fd.append('file', file);
            fd.append('device_name', deviceInput.value || '未命名设备');
            
            try {
                const res = await fetch('/videos/upload', { method: 'POST', body: fd });
                if (res.ok) {
                    // 清空表单
                    fileInput.value = '';
                    deviceInput.value = '';
                }
            } catch (e) {
                alert('上传失败: ' + e.message);
            } finally {
                hideLoading();
                refresh();
            }
        }

        async function startStream(btn, fileId) {
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>初始化...';

            let params = {
                file_id: fileId,
                stream_path: document.getElementById('path_' + fileId).value,
                transport: document.getElementById('transport_' + fileId).value,
                vcodec: document.getElementById('vcodec_' + fileId).value,
                acodec: document.getElementById('acodec_' + fileId).value,
                resolution: document.getElementById('res_' + fileId).value,
                fps: parseFloat(document.getElementById('fps_' + fileId).value),
                bitrate: document.getElementById('bitrate_' + fileId).value,
                crf: parseInt(document.getElementById('crf_' + fileId).value),
                preset: document.getElementById('preset_' + fileId).value
            };

            try {
                const res = await fetch('/streams/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(params)
                });
                if (!res.ok) {
                    const err = await res.json();
                    alert('启动失败: ' + (err.detail || '未知错误'));
                }
            } catch (e) {
                alert('网络错误');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
                refresh();
            }
        }

        async function stopStream(id, btn) {
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>停止中...';
            
            await fetch('/streams/' + id, { method: 'DELETE' });
            refresh();
        }

        async function deleteVideo(id) { 
            if(confirm('确定从服务器永久删除该视频源？')) { 
                showLoading('正在删除...');
                await fetch('/videos/' + id, { method: 'DELETE' }); 
                hideLoading();
                refresh(); 
            } 
        }
        
        async function copyUrl(url, btn) {
            try {
                await navigator.clipboard.writeText(url);
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="bi bi-check-lg text-success"></i>';
                btn.classList.add('btn-light');
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.classList.remove('btn-light');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
        }

        async function init() {
            refresh();
            setInterval(refresh, 8000);
        }

        init();
    </script>
</body>
</html>
